<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#121619" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Trip Planner — 旅行行程共編</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23627b6d%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27m8 3 4 8 5-5 5 15H2L8 3z%27/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- 英文 Manrope、中文思源黑體；每日主題用思源宋體 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=59" />
</head>
<body>

<!-- ───────── 旅程收納首頁 ───────── -->
<main id="home" hidden>
  <nav class="topnav">
    <div class="brand">✈ Trip&nbsp;Planner</div>
    <div class="nav-right">
      <span id="syncDotHome" class="sync-dot" title="連線中"></span>
    </div>
  </nav>

  <header class="home-hero">
    <h1>我出去一下就回來</h1>
    <p class="home-sub">每一趟旅行的行程、航班、住宿與記帳，都收在這裡。</p>
  </header>

  <section class="home-grid-wrap">
    <div class="trips-grid" id="tripsGrid"></div>
    <button class="trash-link" id="trashLink" hidden></button>
  </section>

  <footer class="footer">
    <p>Nomo Trip Planner · 多人即時共編 · Firebase Realtime DB</p>
  </footer>
</main>

<!-- ───────── 行程內頁 ───────── -->
<main id="app" hidden>

  <nav class="topnav">
    <button class="back-btn" id="backBtn" aria-label="回到我的旅程" title="我的旅程"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="tabs">
      <button class="tab active" data-tab="itinerary">行程</button>
      <button class="tab" data-tab="expenses">記帳</button>
      <button class="tab-map" id="tripMapBtn" type="button" aria-label="路線總覽" title="路線總覽"></button>
    </div>
    <div class="nav-right">
      <span id="syncDot" class="sync-dot" title="連線中"></span>
      <button class="ghost-btn edit-toggle" id="editModeBtn">編輯</button>
      <button class="ghost-btn edit-only" id="exportBtn">匯出</button>
    </div>
  </nav>
  <div class="offline-bar" id="offlineBar" hidden>📴 離線中：顯示最後一次同步的資料，恢復連線後自動更新</div>

  <!-- ===== TAB：行程 ===== -->
  <div id="tab-itinerary" class="tab-panel">
    <!-- 天數分頁：固定在頂部，隨時跳到任一天 -->
    <div class="day-tabs-bar">
      <nav class="day-tabs" id="dayNav" aria-label="選擇天數"></nav>
      <button class="day-tabs-add edit-only" id="dayTabsAdd" title="新增一天" aria-label="新增一天">＋</button>
    </div>

    <!-- 封面 -->
    <header class="cover" id="cover">
      <div class="cover-img" id="coverImg"></div>
      <div class="cover-overlay">
        <p class="cover-strip" id="coverStrip"></p>
        <h1 class="cover-title" id="coverTitle" spellcheck="false" data-placeholder="點此編輯行程名稱"></h1>
        <p class="cover-cities" id="coverCities" spellcheck="false" data-placeholder="城市路線"></p>
        <p class="cover-dates" id="coverDates"></p>
      </div>
      <button class="cover-edit-btn edit-only" id="coverEditBtn">編輯封面</button>
    </header>

    <!-- 航班／住宿／交通：極簡圖示入口，點開看詳細 -->
    <nav class="quick-tiles" aria-label="航班、住宿、交通">
      <button class="quick-tile" data-sheet="flights" style="--c: var(--c-transit)">
        <span class="qt-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>
        <span class="qt-label">Flights</span>
        <span class="qt-count" id="qtFlights"></span>
      </button>
      <button class="quick-tile" data-sheet="stays" style="--c: var(--c-hotel)">
        <span class="qt-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M12 4v6"/><path d="M2 18h20"/></svg></span>
        <span class="qt-label">Stays</span>
        <span class="qt-count" id="qtStays"></span>
      </button>
      <button class="quick-tile" data-sheet="transport" style="--c: var(--c-restaurant)">
        <span class="qt-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg></span>
        <span class="qt-label">Transport</span>
        <span class="qt-count" id="qtTransport"></span>
      </button>
    </nav>


    <!-- 詳細面板：航班／住宿／交通 -->
    <div class="info-sheet" id="infoSheet" hidden>
      <div class="info-sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <header>
          <h3 id="sheetTitle"></h3>
          <button class="modal-close" id="sheetClose" aria-label="關閉">×</button>
        </header>
        <div class="info-sheet-body">
          <section class="sheet-group" data-group="flights">
            <div class="sheet-group-head"><span></span><button class="add-btn" data-add="flight">＋ 新增航班</button></div>
            <div class="flights-grid" id="flightsGrid"></div>
          </section>
          <section class="sheet-group" data-group="stays">
            <div class="sheet-group-head"><span></span><button class="add-btn" data-add="hotel">＋ 新增住宿</button></div>
            <div class="hotels-grid" id="hotelsGrid"></div>
          </section>
          <section class="sheet-group" data-group="transport">
            <div class="sheet-group-head"><h4>租車</h4><button class="add-btn" data-add="car">＋ 新增租車</button></div>
            <div class="cars-grid" id="carsGrid"></div>
          </section>
          <section class="sheet-group" data-group="transport">
            <div class="sheet-group-head"><h4>火車</h4><button class="add-btn" data-add="train">＋ 新增火車</button></div>
            <div class="cars-grid" id="trainsGrid"></div>
          </section>
        </div>
      </div>
    </div>

    <!-- 每日行程 -->
    <section class="section section-days">
      <div class="section-head">
        <h2>每日行程</h2>
        <button class="add-btn" id="addDayBtn">+ 新增一天</button>
      </div>
      <div class="days-list" id="daysList"></div>
    </section>

    <div class="danger-zone edit-only">
      <button class="ghost-btn danger" id="deleteTripBtn">刪除這趟行程</button>
    </div>
  </div>

  <!-- ===== TAB：首爾景點庫 ===== -->
  <div id="tab-guide" class="tab-panel" hidden>
    <div class="guide-hero">
      <p class="guide-eyebrow">首爾景點庫</p>
      <h2>景點 · 咖啡廳 · 餐廳 · 購物</h2>
      <p>點「+ 加入行程」可直接選日期與時間段寫入行程</p>
    </div>
    <div class="guide-filter-bar" id="guideFilterBar">
      <button class="guide-filter active" data-filter="all">全部</button>
      <button class="guide-filter" data-filter="spot">景點</button>
      <button class="guide-filter" data-filter="museum">美術館</button>
      <button class="guide-filter" data-filter="cafe">咖啡廳</button>
      <button class="guide-filter" data-filter="restaurant">餐廳</button>
      <button class="guide-filter" data-filter="shopping">購物</button>
    </div>
    <div class="guide-spots-grid" id="guideSpotsGrid"></div>
  </div>

  <!-- ===== TAB：記帳 ===== -->
  <div id="tab-expenses" class="tab-panel" hidden>
    <section class="section">
      <!-- 摘要列 -->
      <div class="expense-summary" id="expenseSummary"></div>

      <!-- 成員 + 匯率 設定 -->
      <div class="expense-config">
        <div class="config-block">
          <span class="config-label">成員</span>
          <div class="members-chips" id="membersChips"></div>
          <button class="ghost-btn small" id="editMembersBtn">編輯成員</button>
        </div>
        <div class="config-block">
          <span class="config-label">匯率（換台幣）</span>
          <div class="rates-chips" id="ratesChips"></div>
          <button class="ghost-btn small" id="editRatesBtn">設定匯率</button>
        </div>
      </div>

      <!-- 每人花費：個人消費＋分攤份額；點某人只看他的明細 -->
      <div class="section-head">
        <h2>每人花費</h2>
      </div>
      <div class="member-stats" id="memberStats"></div>

      <!-- 桌機：左 68% 明細、右 32% 結算；手機依序往下 -->
      <div class="exp-layout">
        <div class="exp-col-main">
          <div class="section-head">
            <h2>支出明細</h2>
            <button class="primary-btn" id="addExpenseBtn">＋ 記一筆</button>
          </div>
          <div class="expense-list" id="expenseList"></div>
        </div>
        <aside class="exp-col-side">
          <div class="section-head">
            <h2>分帳結算</h2>
          </div>
          <div class="settlement" id="settlement"></div>
        </aside>
      </div>
    </section>
  </div>

  <footer class="footer">
    <p>Nomo Trip Planner · 拖曳行程可跨時段／跨日 · 記帳支援多幣別換算與均分結算</p>
  </footer>
</main>

<!-- ───────── 手機：全螢幕路線地圖 ───────── -->
<div class="map-view" id="mapView" hidden>
  <div class="mv-map" id="mvMap"></div>
  <header class="mv-head">
    <div class="mv-head-text"><span id="mvDate"></span><h3 id="mvTitle"></h3></div>
    <button class="mv-close" id="mvClose" aria-label="關閉地圖">×</button>
  </header>
  <section class="mv-drawer" id="mvDrawer" aria-label="當天行程">
    <div class="mv-handle" id="mvHandle" role="button" aria-label="拖曳或點一下展開行程"><span></span></div>
    <div class="mv-list tl-scroll" id="mvList"></div>
  </section>
</div>

<!-- ───────── 路線總覽：整趟行程一張地圖 ───────── -->
<div class="trip-map" id="tripMap" hidden>
  <div class="tm-map" id="tmMap"></div>
  <header class="mv-head tm-head">
    <div class="mv-head-text"><span id="tmMeta"></span><h3 id="tmTitle"></h3></div>
    <button class="mv-close" id="tmClose" aria-label="關閉路線總覽">×</button>
  </header>
  <nav class="tm-days" id="tmDays" aria-label="選擇天數"></nav>
</div>

<!-- ───────── 通用編輯彈窗 ───────── -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <header>
      <h3 id="modalTitle">編輯</h3>
      <button class="modal-close" id="modalClose">×</button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer>
      <button class="ghost-btn danger" id="modalDelete" hidden>刪除</button>
      <div style="flex:1"></div>
      <button class="ghost-btn" id="modalCancel">取消</button>
      <button class="primary-btn" id="modalSave">儲存</button>
    </footer>
  </div>
</div>

<!-- 隱藏的收據拍照 input -->
<input type="file" id="receiptInput" accept="image/*" capture="environment" hidden />

<!-- 小提示 toast -->
<div id="toast" class="toast" hidden></div>

<!-- ───────── 依賴 ───────── -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="guide-data.js?v=8"></script>
<script src="icons.js?v=3"></script>
<script src="app.js?v=55"></script>
</body>
</html>
